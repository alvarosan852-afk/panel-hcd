<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="UTF-8">
    <title>Panel de Accesos - Gestión Documental HCD</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #1a1a1a; 
            color: #fff; 
            padding: 50px 30px; 
            text-align: center; 
        }
        h2 { 
            font-size: 28px; 
            margin-bottom: 5px; 
            color: #f1f1f1; 
        }
        p { 
            color: #aaa; 
            margin-bottom: 40px; 
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        .btn { 
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 18px 35px; 
            font-size: 18px; 
            color: #fff; 
            background-color: #007bff; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            transition: 0.2s; 
            border: 2px solid transparent;
        }
        .btn:hover { 
            background-color: #0056b3; 
            transform: scale(1.02); 
        }
        .btn-green { 
            background-color: #28a745; 
        }
        .btn-green:hover { 
            background-color: #218838; 
        }
        .btn-script {
            background-color: #1b4d3e;
            border-color: #d4af37;
        }
        .btn-script:hover {
            background-color: #143a2f;
            border-color: #aa8c2c;
        }
    </style>
</head>
<body>
    <h2>Gestión Documental HCD</h2>
    <p>Haz clic en el botón del sistema que necesites abrir:</p>
    
    <div class="btn-container">
        <!-- 1. Botón AppSheet -->
        <a href="https://www.appsheet.com/start/17eebf83-5fac-459c-97ab-b4af10ab55a3#appName=REGISTROGESTIONDOCUMENTAL-353381678&page=fastTable&table=Registro+Maestro&view=Registro+Maestro" target="_blank" rel="noopener noreferrer" class="btn">Abrir AppSheet Escritorio</a>
        
        <!-- 2. Botón Google Sheets -->
        <a href="https://docs.google.com/spreadsheets/d/1W2NxddcJM3LasDtHQg2tMZAoqFPGbAs5fTIxnizXpYQ/edit" target="_blank" rel="noopener noreferrer" class="btn btn-green">Abrir Planilla Google Sheets</a>
        
        <!-- 3. Botón Web App Apps Script -->
        <a href="https://script.google.com/macros/s/AKfycbxHz1GgCNi9yYtA_2ctdn3doTiTp66HZWhcYoEiEkq25KeOQrikX3VDiCeG6dzI_CaB/exec" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" class="btn btn-script">Cargar Archivos (Web App)</a>
    </div>

</body>
</html>
