<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Documental HCD</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 5px;
            font-size: 28px;
        }
        p {
            color: #b0b0b0;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 350px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            color: #ffffff;
            transition: opacity 0.2s;
            text-align: center;
        }
        .btn:hover {
            opacity: 0.9;
        }
        /* Estilos de tus botones actuales */
        .btn-azul {
            background-color: #0056b3;
        }
        .btn-verde {
            background-color: #28a745;
        }
        .btn-borde-amarillo {
            background-color: #1e1e1e;
            border: 2px solid #ffc107;
            color: #ffffff;
        }
        /* Nuevo botón amarillo para el Drive del HCD */
        .btn-amarillo {
            background-color: #d39e00;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <h1>Gestión Documental HCD</h1>
    <p>Haz clic en el botón del sistema que necesites abrir:</p>

    <div class="container">
        <!-- Botón 1: AppSheet Escritorio -->
        <a href="https://www.appsheet.com/start/17eebf83-5fac-459c-97ab-b4af10ab55a3?platform=desktop#appName=REGISTROGESTIONDOCUMENTALHCD-234340486-26-09-17-2&vss=H4sIAAAAAAAAA62PywrCMBBFf0Xuul-QrbgQqQsVN8ZFbKYSbJPSpGoJ-XcnPhBcqqthznAPdyLOhi7roKoTxC6-twWNEIgSm7EjCSExdTb0rpEoJJaqfcAVHY1nPCkV5SmRkPbFyxPIQ8TvNOI_bQoYTTaY2lCfndnArmeezznN4DOLVKAdgjo0dH-Esykxq101eNJbrvZDJT-3s2unrC6dZnWtGk_pBtSIBiqNAQAA&view=Registro%20Maestro" target="_blank" class="btn btn-azul">
            📱 Abrir AppSheet Escritorio
        </a>

        <!-- Botón 2: Planilla Google Sheets -->
        <a href="https://docs.google.com/spreadsheets/d/TU_ENLACE_DE_SHEETS" target="_blank" class="btn btn-verde">
            📊 Abrir Planilla Google Sheets
        </a>

        <!-- Botón 3: Cargar Archivos (Web App) -->
        <a href="https://script.google.com/macros/s/TU_ENLACE_DE_SCRIPT/exec" target="_blank" class="btn btn-borde-amarillo">
            📁 Cargar Archivos (Web App)
        </a>

        <!-- Botón 4 NUEVO: Google Drive del HCD -->
        <a href="https://drive.google.com/drive/u/3/home" target="_blank" class="btn btn-amarillo">
            📂 Abrir Google Drive HCD
        </a>
    </div>

</body>
</html>
